name: CD - Build and Push Image

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches: [main]

jobs:
  build-and-push-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout kode (commit yang sama dengan yang di-test CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login ke ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (lokal dulu, belum push)
        uses: docker/build-push-action@v5
        with:
          context: ./account-service
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/account-service:latest
            ghcr.io/${{ github.repository_owner }}/account-service:${{ github.event.workflow_run.head_sha }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/account-service:latest
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Jalankan container untuk DAST scan
        run: |
          docker run -d --name zap-target -p 8080:8080 ghcr.io/${{ github.repository_owner }}/account-service:latest
          echo "Menunggu aplikasi siap..."
          for i in {1..20}; do
            if curl -sf http://localhost:8080/actuator/health/readiness; then
              echo "Aplikasi siap!"
              break
            fi
            sleep 3
          done

      - name: OWASP ZAP Baseline Scan
        continue-on-error: true
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-I'
          allow_issue_writing: false
          artifact_name: zap-report-${{ github.event.workflow_run.head_sha }}

      - name: Stop container DAST scan
        if: always()
        run: docker stop zap-target && docker rm zap-target

      - name: Push image (hanya jalan kalau scan lolos)
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/account-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/account-service:${{ github.event.workflow_run.head_sha }}

      - name: Update tag image di manifest Kubernetes
        run: |
          sed -i "s|image: ghcr.io/${{ github.repository_owner }}/account-service:.*|image: ghcr.io/${{ github.repository_owner }}/account-service:${{ github.event.workflow_run.head_sha }}|" k8s/deployment.yaml

      - name: Commit dan push perubahan manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --staged --quiet && echo "Tidak ada perubahan" || git commit -m "chore: update k8s manifest image tag to ${{ github.event.workflow_run.head_sha }} [skip ci]"
          git push origin HEAD:main


      - name: Notify n8n on failure (webhook)
        if: failure()
        run: |
          curl -X POST https://landlord-aviator-sizzling.ngrok-free.dev/webhook/cicd-failure-alert \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ secrets.N8N_WEBHOOK_SECRET }}" \
            -H "ngrok-skip-browser-warning: true" \
            -d '{"repo":"${{ github.repository }}","run_id":"${{ github.run_id }}","workflow":"${{ github.workflow }}","branch":"${{ github.ref_name }}"}'