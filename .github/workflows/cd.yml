name: CD - Build and Push Image

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches: [main]

jobs:
  build-and-push-image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout kode (commit yang sama dengan yang di-test CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login ke ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (lokal dulu, belum push)
        uses: docker/build-push-action@v5
        with:
          context: ./account-service
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/account-service:latest
            ghcr.io/${{ github.repository_owner }}/account-service:${{ github.event.workflow_run.head_sha }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/account-service:latest
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Push image (hanya jalan kalau scan lolos)
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/account-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/account-service:${{ github.event.workflow_run.head_sha }}

      - name: Update tag image di manifest Kubernetes
        run: |
          sed -i "s|image: ghcr.io/${{ github.repository_owner }}/account-service:.*|image: ghcr.io/${{ github.repository_owner }}/account-service:${{ github.event.workflow_run.head_sha }}|" k8s/deployment.yaml

      - name: Commit dan push perubahan manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --staged --quiet && echo "Tidak ada perubahan" || git commit -m "chore: update k8s manifest image tag to ${{ github.event.workflow_run.head_sha }} [skip ci]"
          git push origin HEAD:main
